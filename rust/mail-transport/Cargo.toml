[package]
name = "email-rethink-mail-transport"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "mail_transport"
crate-type = ["cdylib", "staticlib", "rlib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[[test]]
name = "greenmail"
required-features = ["test-ca"]

[features]
default = []
# Nur für die Erzeugung der Kotlin-/Swift-Bindings (Host-Werkzeug).
bindgen = ["uniffi/cli"]
# Nur für Integrationstests: erlaubt eine zusätzliche Test-CA. Niemals in App-Builds aktivieren.
test-ca = []

[dependencies]
uniffi = { version = "0.29.4", features = ["tokio"] }
async-imap = { version = "0.12.0", default-features = false, features = ["runtime-tokio"] }
tokio = { version = "1.41", features = ["rt-multi-thread", "net", "time", "io-util"] }
# ring statt aws-lc-rs: kein CMake/C-Toolchain-Zwang beim Cross-Compile für Android und iOS (Review W4).
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1"
futures-util = "0.3"
mail-parser = "1.0.1"
thiserror = "2"
zeroize = "1"

[dev-dependencies]
tokio = { version = "1.41", features = ["rt-multi-thread", "net", "time", "io-util", "macros"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
