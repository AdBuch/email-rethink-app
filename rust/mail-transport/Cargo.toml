[package]
name = "email-rethink-mail-transport"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "email_rethink_mail_transport"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
uniffi = "0.29.4"
async-imap = { version = "0.12.0", default-features = false, features = ["runtime-tokio"] }
tokio = { version = "1.41", features = ["rt-multi-thread", "net", "time", "io-util"] }
tokio-rustls = "0.26"
webpki-roots = "0.26"
futures-util = "0.3"

[build-dependencies]
uniffi = { version = "0.29.4", features = ["build"] }
