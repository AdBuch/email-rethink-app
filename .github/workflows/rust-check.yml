name: Rust Transport
on:
  pull_request:
  push:
    branches: [main, feature/phase-0-grundlagen]
jobs:
  rust-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust/mail-transport
    steps:
      - uses: actions/checkout@v4
      - name: Rust installieren
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Formatierung
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test
