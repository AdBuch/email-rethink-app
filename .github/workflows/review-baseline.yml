# Temporärer Diagnose-Workflow für das Review: baut den unveränderten Codex-Stand,
# damit die Befunde aus docs/reviews/REVIEW-PHASE-0.md mit echten Läufen belegt sind.
# Wird vor dem Merge wieder entfernt.
name: Review-Baseline (temporär)
on:
  push:
    branches: [feature/phase-0-grundlagen]
jobs:
  rust-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: cargo build (Originalstand)
        working-directory: rust/mail-transport
        run: |
          set +e
          cargo build 2>&1 | tail -n 200
          echo "BASELINE cargo build exit=${PIPESTATUS[0]}"
      - name: cargo clippy (Originalstand)
        working-directory: rust/mail-transport
        run: |
          set +e
          cargo clippy --all-targets -- -D warnings 2>&1 | tail -n 120
          echo "BASELINE cargo clippy exit=${PIPESTATUS[0]}"
      - name: cargo test (Originalstand)
        working-directory: rust/mail-transport
        run: |
          set +e
          cargo test 2>&1 | tail -n 80
          echo "BASELINE cargo test exit=${PIPESTATUS[0]}"
      - name: TLS-Kryptoanbieter im Abhängigkeitsbaum (W4)
        working-directory: rust/mail-transport
        run: |
          set +e
          cargo tree -i aws-lc-sys 2>&1 | head -n 30
          echo "BASELINE aws-lc-sys exit=$?"
          cargo tree -i ring 2>&1 | head -n 30
          echo "BASELINE ring exit=$?"
  android-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gradle-Build ohne Wrapper (Originalstand)
        run: |
          set +e
          ls gradlew gradle/wrapper 2>&1
          java -version 2>&1
          gradle --version | head -n 12
          gradle :androidApp:assembleDebug --stacktrace 2>&1 | tail -n 200
          echo "BASELINE gradle assembleDebug exit=${PIPESTATUS[0]}"
  api-auskunft:
    # Liefert Signaturen und Versionsstände, weil die Entwicklungsumgebung keinen Registry-Zugriff hat.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Signaturen async-imap
        working-directory: rust/mail-transport
        run: |
          set +e
          cargo fetch >/dev/null 2>&1
          S=$(ls -d ~/.cargo/registry/src/*/async-imap-0.12*)
          echo "SRC=$S"; ls $S/src $S/src/types
          grep -nE "^\s*pub (async )?fn |^impl|^pub struct|^pub enum" -A3 $S/src/client.rs | grep -vE "^\-\-$|///" | head -n 330
          echo "=== fetch.rs"; grep -nE "pub (async )?fn |pub [a-z_]+:|^impl|^pub struct" -A2 $S/src/types/fetch.rs | grep -v "///" | head -n 120
          echo "=== mailbox.rs"; grep -nE "pub [a-z_]+:" $S/src/types/mailbox.rs
          echo "=== error.rs"; sed -n '1,80p' $S/src/error.rs | grep -v "///"
          echo "=== Cargo features"; sed -n '/\[features\]/,/^$/p' $S/Cargo.toml
          P=$(ls -d ~/.cargo/registry/src/*/imap-proto-*); echo "=== imap-proto $P"; grep -n "pub struct Envelope" -A14 $P/src/types.rs; grep -n "pub struct Address" -A8 $P/src/types.rs
      - name: Versionen
        run: |
          set +e
          for c in mail-parser thiserror cargo-ndk uniffi rustls tokio-rustls webpki-roots rustls-pemfile zeroize; do cargo search $c --limit 1 2>/dev/null | head -n 1; done
          rustc --version; xcodegen --version 2>&1 | head -n1
          for a in actions/checkout:v4 actions/checkout:v5 actions/setup-java:v4 actions/setup-java:v5 actions/upload-artifact:v4; do r=${a%%:*}; t=${a##*:}; echo "$a $(git ls-remote https://github.com/$r "refs/tags/$t*" | sort -t/ -k3 -V | tail -n 3 | tr '\n' ' ')"; done
          echo "gradle-8.14.3 sha256: $(curl -sL https://services.gradle.org/distributions/gradle-8.14.3-bin.zip.sha256)"
          for m in net/zetetic/sqlcipher-android net/java/dev/jna/jna org/jetbrains/kotlinx/kotlinx-coroutines-core app/cash/sqldelight/runtime; do echo "$m: $(curl -sL https://repo1.maven.org/maven2/$m/maven-metadata.xml | grep -E '<release>|<latest>' | tr -d ' \n')"; done
          for m in androidx/sqlite/sqlite androidx/lifecycle/lifecycle-viewmodel-compose androidx/compose/material3/material3 androidx/activity/activity-compose com/android/tools/build/gradle; do echo "$m: $(curl -sL https://dl.google.com/dl/android/maven2/$m/maven-metadata.xml | grep -oE '<version>[^<]*</version>' | grep -vE 'alpha|beta|rc' | tail -n 3 | tr -d '\n')"; done
          echo "NDK: $ANDROID_NDK_HOME $ANDROID_NDK_LATEST_HOME"; ls $ANDROID_HOME/ndk
          docker run --rm --entrypoint sh greenmail/standalone:2.1.3 -c 'ls -la /home/greenmail; cat /home/greenmail/*.sh 2>/dev/null | head -n 30' 2>&1 | tail -n 40
      - name: mail-parser API
        run: |
          set +e
          mkdir /tmp/mp && cd /tmp/mp && cargo init --name mp -q && cargo add mail-parser -q && cargo fetch -q
          S=$(ls -d ~/.cargo/registry/src/*/mail-parser-*); echo "SRC=$S"
          grep -rnE "pub fn (parse|subject|body_text|body_html|text_bodies|html_bodies|from|date|message_id)\b" -A2 $S/src | head -n 60
          grep -n "pub enum PartType" -A22 $S/src/lib.rs
