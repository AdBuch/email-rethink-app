name: CI
on:
  pull_request:
  push:
    branches: [main, feature/phase-0-grundlagen]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-check:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: rust/mail-transport
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Rust-Toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Formatierung
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Unit-Tests
        run: cargo test --locked --lib
      - name: Abhängigkeiten – kein aws-lc, nur ring (Review W4)
        run: |
          if cargo tree --locked -e normal -i aws-lc-sys >/dev/null 2>&1; then
            echo "aws-lc-sys ist im Abhängigkeitsbaum" >&2; exit 1
          fi
          cargo tree --locked -e normal -i ring | head -n 5

  imap-integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Rust-Toolchain (rust-toolchain.toml)
        working-directory: rust/mail-transport
        run: rustup show active-toolchain || rustup toolchain install
      - name: GreenMail-Integrationstests mit Test-CA
        run: tests/greenmail/run.sh

  android-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Gradle-Wrapper-Prüfsumme
        run: echo "7d3a4ac4de1c32b59bc6a4eb8ecb8e612ccd0cf1ae1e99f66902da64df296172  gradle/wrapper/gradle-wrapper.jar" | sha256sum --check
      - name: Rust-Targets und cargo-ndk
        working-directory: rust/mail-transport
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add aarch64-linux-android x86_64-linux-android
          cargo install cargo-ndk --locked --version 3.5.4
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.3.13750724" >> "$GITHUB_ENV"
      - name: KMP-Compile, Unit-Tests und Debug-APK
        run: ./gradlew --no-daemon --stacktrace :shared:core-store:testDebugUnitTest :androidApp:assembleDebug
      - name: APK-Inhalt prüfen (Rust-Kern, JNA, SQLCipher für beide ABIs)
        run: |
          APK=androidApp/build/outputs/apk/debug/androidApp-debug.apk
          ls -l "$APK"
          unzip -l "$APK" | grep -E "lib/(arm64-v8a|x86_64)/" | tee /tmp/libs.txt
          for abi in arm64-v8a x86_64; do
            for lib in libmail_transport.so libjnidispatch.so libsqlcipher.so; do
              grep -q "lib/$abi/$lib" /tmp/libs.txt || { echo "fehlt: lib/$abi/$lib" >&2; exit 1; }
            done
          done
