services:
  greenmail:
    image: greenmail/standalone:2.1.3
    ports:
      - "127.0.0.1:3993:3993"
    environment:
      GREENMAIL_OPTS: "-Dgreenmail.setup.test.imaps -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.verbose=false"
      JAVA_OPTS: "-Djava.net.preferIPv4Stack=true"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 3993 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
