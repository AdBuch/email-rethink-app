# Lokaler Wegwerf-Mailserver für Integrationstests. Nur an 127.0.0.1 gebunden.
# Die Benutzer und das Passwort existieren ausschliesslich in diesem Testserver.
services:
  greenmail:
    image: greenmail/standalone:2.1.3
    ports:
      - "127.0.0.1:3993:3993" # IMAPS mit gültigem Testzertifikat
      - "127.0.0.1:3143:3143" # Klartext-IMAP, nur für den Negativtest „kein Klartext-Fallback“
    volumes:
      - ./certs/valid.p12:/certs/server.p12:ro
    environment:
      JAVA_OPTS: "-Djava.net.preferIPv4Stack=true"
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.imap
        -Dgreenmail.setup.test.imaps
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.tls.keystore.file=/certs/server.p12
        -Dgreenmail.tls.keystore.password=changeit
        -Dgreenmail.users=liste:nur-lokaler-test@example.org,leer:nur-lokaler-test@example.org,inhalt:nur-lokaler-test@example.org,wechsel:nur-lokaler-test@example.org,b4:nur-lokaler-test@example.org

  greenmail-abgelaufen:
    image: greenmail/standalone:2.1.3
    ports:
      - "127.0.0.1:4993:3993" # IMAPS mit abgelaufenem Testzertifikat
    volumes:
      - ./certs/expired.p12:/certs/server.p12:ro
    environment:
      JAVA_OPTS: "-Djava.net.preferIPv4Stack=true"
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.imaps
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.tls.keystore.file=/certs/server.p12
        -Dgreenmail.tls.keystore.password=changeit
        -Dgreenmail.users=liste:nur-lokaler-test@example.org
